name: Store verified Unicode Studio 16–19 APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/store-unicode-studio-16-19.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add exact verified APK and preserve all existing APKs
        run: |
          find apk -name '*.apk' -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/previous-apks.sha256
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/ae6820dc/9062/566e67383a6a0c3f2aa3202c7fc8b6565363cb38/android-distributions/Unicode-Studio-16-19.apk' -o /tmp/Unicode-Studio-16-19.apk
          echo 'cd4469d5d7e1a0267efa9adb66976f933fb02b07cdfbf1f8566cfb11c7ccdbbf  /tmp/Unicode-Studio-16-19.apk' | sha256sum -c -
          (set -o noclobber; cat /tmp/Unicode-Studio-16-19.apk > apk/Unicode-Studio-16-19.apk)
          sha256sum -c /tmp/previous-apks.sha256
          sha256sum apk/Unicode-Studio-16-19.apk > apk/Unicode-Studio-16-19.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk/Unicode-Studio-16-19.apk apk/Unicode-Studio-16-19.apk.sha256
          git commit -m 'Add verified Unicode Studio 16–19 signed debug APK'
          git pull --rebase origin main
          git push origin HEAD:main
