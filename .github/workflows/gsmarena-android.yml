name: Build GSMArena APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gsmarena-android/**'
      - '.github/workflows/gsmarena-android.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gsmarena-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ||
                ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK signature and metadata
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify "$apk"
          metadata=$("$tools/aapt" dump badging "$apk")
          grep -F "package: name='com.example.gsmarenawrapper'" <<< "$metadata"
          grep -Fx "application-label:'GSMArena'" <<< "$metadata"
          grep -Fx "targetSdkVersion:'36'" <<< "$metadata"
          grep -F "launchable-activity: name='com.example.gsmarenawrapper.MainActivity'" <<< "$metadata"
      - uses: actions/upload-artifact@v4
        with:
          name: GSMArena-APK
          path: gsmarena-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
