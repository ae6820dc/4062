name: Build 4062 Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/4062-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Copy proven 9062 Android project
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/ae6820dc/9062.git /tmp/source9062
          git -C /tmp/source9062 sparse-checkout set android-9062-web
          cp -a /tmp/source9062/android-9062-web ./android-4062-web
          python3 - <<'PY'
          from pathlib import Path
          root=Path('android-4062-web')
          for p in (root/'app/src/main/java').rglob('MainActivity.java'):
              t=p.read_text().replace('web9062','web4062').replace('/9062/index.html','/4062/index.html')
              p.write_text(t)
              dest=root/'app/src/main/java/io/github/ae6820dc/web4062'
              dest.mkdir(parents=True,exist_ok=True)
              p.rename(dest/'MainActivity.java')
          manifest=root/'app/src/main/AndroidManifest.xml'
          manifest.write_text(manifest.read_text().replace('9062','4062'))
          gradle=root/'app/build.gradle'
          gradle.write_text(gradle.read_text().replace('9062','4062'))
          settings=root/'settings.gradle'
          settings.write_text(settings.read_text().replace('9062','4062'))
          PY
          python3 - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          from pathlib import Path
          target=Path('android-4062-web/app/src/main/res/drawable')
          target.mkdir(parents=True,exist_ok=True)
          im=Image.new('RGB',(512,512),'#101827')
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((22,22,490,490),radius=95,fill='#14243b')
          d.line((65,130,447,130),fill='#2dd4d0',width=14)
          d.line((65,380,447,380),fill='#2dd4d0',width=14)
          f=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf',116)
          d.text((256,255),'4062',font=f,fill='white',anchor='mm')
          im.save(target/'icon_4062.png')
          PY
      - name: Configure Android SDK
        run: |
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android-4062-web
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: 4062-APK
          path: android-4062-web/app/build/outputs/apk/debug/app-debug.apk
