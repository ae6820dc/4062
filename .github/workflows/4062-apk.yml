name: Build 4062 Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/4062-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare 4062 app from working 9062 source files
        shell: bash
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/ae6820dc/9062/main/android-9062-web
          root=android-4062-web
          mkdir -p "$root/app/src/main/java/io/github/ae6820dc/web4062" "$root/app/src/main/res/drawable"
          curl -fLsS --retry 3 "$base/settings.gradle" -o "$root/settings.gradle"
          curl -fLsS --retry 3 "$base/build.gradle" -o "$root/build.gradle"
          curl -fLsS --retry 3 "$base/app/build.gradle" -o "$root/app/build.gradle"
          curl -fLsS --retry 3 "$base/app/src/main/AndroidManifest.xml" -o "$root/app/src/main/AndroidManifest.xml"
          curl -fLsS --retry 3 "$base/app/src/main/java/io/github/ae6820dc/web9062/MainActivity.java" -o "$root/app/src/main/java/io/github/ae6820dc/web4062/MainActivity.java"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('android-4062-web')
          for p in [root/'settings.gradle',root/'app/build.gradle',root/'app/src/main/AndroidManifest.xml',root/'app/src/main/java/io/github/ae6820dc/web4062/MainActivity.java']:
              p.write_text(p.read_text().replace('9062','4062'))
          PY
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          im=Image.new('RGBA',(512,512),(248,247,244,255))
          d=ImageDraw.Draw(im)
          d.polygon([(95,168),(252,81),(420,166),(260,254)],fill='#E7B977')
          d.polygon([(95,168),(260,254),(260,431),(95,339)],fill='#C98A4B')
          d.polygon([(260,254),(420,166),(420,339),(260,431)],fill='#AC703D')
          d.polygon([(170,126),(332,214),(300,231),(139,143)],fill='#F4D3A1')
          d.polygon([(300,231),(332,214),(332,383),(300,403)],fill='#D6A36C')
          d.line([(95,168),(260,254),(420,166)],fill='#8E582D',width=5)
          d.line([(260,254),(260,431)],fill='#8E582D',width=5)
          im.save('android-4062-web/app/src/main/res/drawable/icon_4062.png')
          PY
      - name: Configure Android SDK
        run: |
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android-4062-web
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify installable APK
        run: test -s android-4062-web/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 4062-APK
          path: android-4062-web/app/build/outputs/apk/debug/app-debug.apk
