name: Build 4062 Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/4062-apk.yml'
      - 'android-4062-web/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        working-directory: android-4062-web
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK signature and metadata
        working-directory: android-4062-web
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify "$apk"
          metadata=$("$tools/aapt" dump badging "$apk")
          grep -F "package: name='io.github.ae6820dc.web4062'" <<< "$metadata"
          grep -Fx "application-label:'4062'" <<< "$metadata"
          grep -Fx "targetSdkVersion:'36'" <<< "$metadata"
          grep -F "launchable-activity: name='io.github.ae6820dc.web4062.MainActivity'" <<< "$metadata"
      - uses: actions/upload-artifact@v4
        with:
          name: 4062-APK
          path: android-4062-web/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
