name: Build 4062 Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/4062-apk.yml'
      - 'android-4062-web/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ||
                ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        working-directory: android-4062-web
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK signature and metadata
        working-directory: android-4062-web
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify "$apk"
          metadata=$("$tools/aapt" dump badging "$apk")
          grep -F "package: name='io.github.ae6820dc.web4062' versionCode='3' versionName='1.2'" <<< "$metadata"
          grep -Fx "application-label:'4062'" <<< "$metadata"
          grep -Fx "targetSdkVersion:'36'" <<< "$metadata"
          grep -F "launchable-activity: name='io.github.ae6820dc.web4062.MainActivity'" <<< "$metadata"
      - name: Prepare versioned APK and compare signing certificates
        run: |
          mkdir -p 7
          cp android-4062-web/app/build/outputs/apk/debug/app-debug.apk 7/4062-multitab-1.2.apk
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          signer() {
            "$apksigner" verify --print-certs "$1" | grep -F 'certificate SHA-256 digest:'
          }
          original=$(signer apk/6/4062-multitab-1.1.apk)
          current=$(signer 7/4062-multitab-1.2.apk)
          if [[ "$original" != "$current" ]]; then
            echo "::warning::APK signing certificates differ. Android will require a fresh install."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: 4062-multitab-1.2
          path: 7/4062-multitab-1.2.apk
          if-no-files-found: error
