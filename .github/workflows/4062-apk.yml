name: Build 4062 Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/4062-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub Ubuntu runners include the Android SDK; avoid setup-android failure.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/ae6820dc/app4062 app/src/main/res/drawable
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'App4062'
          include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ae6820dc.app4062'
              compileSdk 35
              defaultConfig { applicationId 'com.ae6820dc.app4062'; minSdk 24; targetSdk 28; versionCode 1; versionName '1.0' }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="4062" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:usesCleartextTraffic="false" android:icon="@drawable/app_icon">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          im=Image.new('RGBA',(512,512),(16,24,39,255))
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((22,22,490,490),radius=105,fill=(16,24,39,255))
          d.rounded_rectangle((47,47,465,465),radius=82,fill=(18,154,159,255))
          font=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',138)
          text='4062'
          box=d.textbbox((0,0),text,font=font,stroke_width=0)
          d.text(((512-(box[2]-box[0]))/2-box[0],(512-(box[3]-box[1]))/2-box[1]-4),text,font=font,fill='white')
          im.save('app/src/main/res/drawable/app_icon.png')
          PY
          cat > app/src/main/java/com/ae6820dc/app4062/MainActivity.java <<'EOF'
          package com.ae6820dc.app4062;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.view.ViewGroup;
          public class MainActivity extends Activity {
            WebView web;
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              web = new WebView(this);
              setContentView(web, new ViewGroup.LayoutParams(-1,-1));
              WebSettings s=web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setBuiltInZoomControls(true);
              s.setDisplayZoomControls(false);
              s.setSupportZoom(true);
              s.setUseWideViewPort(true);
              s.setLoadWithOverviewMode(true);
              web.setWebViewClient(new WebViewClient());
              web.setWebChromeClient(new WebChromeClient());
              web.loadUrl("https://ae6820dc.github.io/4062/index.html");
            }
            @Override public void onBackPressed() {
              if(web.canGoBack()) web.goBack(); else super.onBackPressed();
            }
          }
          EOF
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 4062-zoomable-apk
          path: app/build/outputs/apk/debug/app-debug.apk
