name: Build Moscow Times APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/moscow-times-android.yml'
      - 'moscow-times-android/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ||
                ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        working-directory: moscow-times-android
        run: gradle :app:assembleDebug --no-daemon
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify touch refresh in Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: >-
            cd moscow-times-android &&
            gradle :app:assembleDebugAndroidTest --no-daemon &&
            adb install app/build/outputs/apk/debug/app-debug.apk &&
            adb install -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk &&
            adb shell am instrument -w -r com.example.moscowtimesweb.test/com.example.moscowtimesweb.RefreshTestRunner > refresh-test.log &&
            cat refresh-test.log &&
            grep -Fx 'INSTRUMENTATION_STATUS_CODE: 0' refresh-test.log &&
            grep -Fx 'INSTRUMENTATION_CODE: -1' refresh-test.log
      - name: Verify APK signature and metadata
        working-directory: moscow-times-android
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify "$apk"
          metadata=$("$tools/aapt" dump badging "$apk")
          grep -F "package: name='com.example.moscowtimesweb' versionCode='7' versionName='1.6'" <<< "$metadata"
          grep -Fx "application-label:'Moscow Times'" <<< "$metadata"
          grep -Fx "targetSdkVersion:'36'" <<< "$metadata"
          grep -F "launchable-activity: name='com.example.moscowtimesweb.MainActivity'" <<< "$metadata"
      - name: Prepare versioned APK and compare signing certificates
        run: |
          mkdir -p 7
          cp moscow-times-android/app/build/outputs/apk/debug/app-debug.apk 7/moscow-times-multitab-1.6.apk
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          signer() {
            "$apksigner" verify --print-certs "$1" | grep -F 'certificate SHA-256 digest:'
          }
          original=$(signer apk/6/moscow-times-multitab-1.5.apk)
          current=$(signer 7/moscow-times-multitab-1.6.apk)
          if [[ "$original" != "$current" ]]; then
            echo "::warning::APK signing certificates differ. Android will require a fresh install."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: moscow-times-multitab-1.6
          path: 7/moscow-times-multitab-1.6.apk
          if-no-files-found: error
