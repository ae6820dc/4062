<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>System Calculator v20</title>
  <style>
    :root {
      --bg: #000; --calc-bg: #001100; --text: #0f0; --btn-bg: #002200; --btn-hover: #003300; --btn-active: #004400;
      --op-bg: #330000; --op-text: #f00; --eq-bg: #003300; --clear-bg: #500000; --mode-bg: #000033; --mode-text: #00f;
      --theme-bg: #111; --theme-text: #fff; --export-bg: #003300; --export-text: #0f0;
      --scrollbar: #0f0; --scrollbar-track: #001100; --border: #0f0; --glow: 0 0 25px rgba(0,255,0,0.6);
    }
    [data-theme="ocean"] {
      --bg: #001122; --calc-bg: #002233; --text: #00ffff; --btn-bg: #003344; --btn-hover: #004455; --btn-active: #005566;
      --op-bg: #330011; --op-text: #ff00ff; --eq-bg: #004444; --clear-bg: #550011; --mode-bg: #001133; --mode-text: #00aaff;
      --theme-bg: #112233; --theme-text: #fff; --export-bg: #004444; --export-text: #00ffff;
      --scrollbar: #00ffff; --scrollbar-track: #002233; --border: #00ffff; --glow: 0 0 25px rgba(0,255,255,0.6);
    }
    [data-theme="sunset"] {
      --bg: #220000; --calc-bg: #331100; --text: #ffcc00; --btn-bg: #442200; --btn-hover: #553300; --btn-active: #664400;
      --op-bg: #330000; --op-text: #ff6600; --eq-bg: #553300; --clear-bg: #550000; --mode-bg: #331100; --mode-text: #ffaa00;
      --theme-bg: #332211; --theme-text: #fff; --export-bg: #553300; --export-text: #ffcc00;
      --scrollbar: #ffcc00; --scrollbar-track: #331100; --border: #ffcc00; --glow: 0 0 25px rgba(255,204,0,0.6);
    }

    body {
      font-family: 'Courier New', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      transition: all 0.3s ease;
    }
    .calculator {
      background: var(--calc-bg);
      padding: 20px;
      border-radius: 20px;
      box-shadow: var(--glow), inset 0 0 12px rgba(0,0,0,0.5);
      width: 360px;
      max-width: 95vw;
      border: 2px solid var(--border);
      box-sizing: border-box;
    }
    .mode {
      text-align: center;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 1.1em;
    }
    .display {
      background: var(--calc-bg);
      color: var(--text);
      font-size: clamp(1.4em, 5vw, 1.8em);
      padding: 16px;
      text-align: right;
      border-radius: 12px;
      margin-bottom: 16px;
      min-height: 56px;
      overflow-x: auto;
      white-space: nowrap;
      border: 1px solid var(--border);
      box-shadow: inset 0 0 8px rgba(0,0,0,0.3);
      letter-spacing: 1.2px;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    button {
      padding: 16px 8px;
      font-size: 1.2em;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--btn-bg);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: bold;
    }
    button:hover { background: var(--btn-hover); transform: translateY(-2px); }
    button:active { background: var(--btn-active); transform: scale(0.96); }
    button.operator { background: var(--op-bg); border-color: var(--op-text); color: var(--op-text); }
    button.equals { background: var(--eq-bg); grid-row: span 2; }
    button.clear { background: var(--clear-bg); border-color: var(--op-text); color: var(--op-text); }
    button.mode-btn { background: var(--mode-bg); border-color: var(--mode-text); color: var(--mode-text); }
    button.theme-btn, button.export-btn { font-size: 1em; }
    button.zero { grid-column: span 2; }
    .hex-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      margin-top: 8px;
      display: none;
    }
    .controls-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body data-theme="matrix">

<div class="calculator">
  <div class="mode" id="mode">System: DEC</div>
  <div class="display" id="display">0</div>

  <div class="buttons">
    <!-- Első sor: vezérlők -->
    <div class="controls-row">
      <button class="mode-btn" onclick="toggleMode()">System</button>
      <button class="theme-btn" onclick="cycleTheme()">Theme</button>
    </div>

    <!-- Második sor -->
    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="deleteLast()">←</button>
    <button class="operator" onclick="appendOperator('/')">/</button>
    <button class="operator" onclick="appendOperator('*')">×</button>

    <!-- Számok és műveletek -->
    <button onclick="appendToDisplay('7')">7</button>
    <button onclick="appendToDisplay('8')">8</button>
    <button onclick="appendToDisplay('9')">9</button>
    <button class="operator" onclick="appendOperator('-')">-</button>

    <button onclick="appendToDisplay('4')">4</button>
    <button onclick="appendToDisplay('5')">5</button>
    <button onclick="appendToDisplay('6')">6</button>
    <button class="operator" onclick="appendOperator('+')">+</button>

    <button onclick="appendToDisplay('1')">1</button>
    <button onclick="appendToDisplay('2')">2</button>
    <button onclick="appendToDisplay('3')">3</button>
    <button class="equals" onclick="calculate()">=</button>

    <button class="zero" onclick="appendToDisplay('0')">0</button>
    <button onclick="appendToDisplay('.')">.</button>
    <button class="export-btn" onclick="exportToHTML()">Export</button>

    <!-- HEX sor (csak HEX módban látható) -->
    <div class="hex-row" id="hexRow">
      <button onclick="appendToDisplay('A')">A</button>
      <button onclick="appendToDisplay('B')">B</button>
      <button onclick="appendToDisplay('C')">C</button>
      <button onclick="appendToDisplay('D')">D</button>
      <button onclick="appendToDisplay('E')">E</button>
      <button onclick="appendToDisplay('F')">F</button>
    </div>
  </div>
</div>

<script>
  const display = document.getElementById('display');
  const modeText = document.getElementById('mode');
  const hexRow = document.getElementById('hexRow');
  const body = document.body;
  let mode = 'DEC';
  let internalExpr = '0';
  let lastResult = '';
  let history = [];
  const MAX_DIGITS = 100000;
  const themes = ['matrix', 'ocean', 'sunset'];
  let currentTheme = 0;

  function updateDisplay() {
    const reversed = internalExpr.split('').reverse().join('');
    display.innerText = reversed || '0';
    display.scrollLeft = display.scrollWidth;
  }

  function loadState() {
    const saved = JSON.parse(localStorage.getItem('systemCalc') || '{}');
    mode = saved.mode || 'DEC';
    internalExpr = saved.expr || '0';
    lastResult = saved.result || '';
    history = saved.history || [];
    currentTheme = themes.indexOf(saved.theme || 'matrix');
    if (currentTheme === -1) currentTheme = 0;
    body.setAttribute('data-theme', themes[currentTheme]);
    updateMode();
    updateDisplay();
  }

  function saveState() {
    const state = { mode, expr: internalExpr, result: lastResult, history, theme: themes[currentTheme] };
    localStorage.setItem('systemCalc', JSON.stringify(state));
  }

  function appendToDisplay(value) {
    if (internalExpr === '0' && value !== '.') internalExpr = value;
    else if (internalExpr.length < MAX_DIGITS) internalExpr += value;
    updateDisplay();
    saveState();
  }

  function appendOperator(op) {
    const lastChar = internalExpr.slice(-1);
    if ('+-*/×'.includes(lastChar)) internalExpr = internalExpr.slice(0, -1);
    
    const exprForHistory = lastResult && internalExpr === lastResult ? lastResult : internalExpr;
    history.push(exprForHistory.replace('×', '*') + ' ' + op.replace('×', '*'));
    
    internalExpr += op;
    updateDisplay();
    saveState();
  }

  function clearDisplay() {
    internalExpr = '0';
    lastResult = '';
    history = [];
    updateDisplay();
    saveState();
  }

  function deleteLast() {
    internalExpr = internalExpr.length > 1 ? internalExpr.slice(0, -1) : '0';
    updateDisplay();
    saveState();
  }

  function toggleMode() {
    mode = mode === 'DEC' ? 'HEX' : 'DEC';
    updateMode();
    if (mode === 'DEC') {
      internalExpr = internalExpr.replace(/[A-F.]/gi, '');
      if (!internalExpr || /^[+\-*/×]$/.test(internalExpr)) internalExpr = '0';
    }
    updateDisplay();
    saveState();
  }

  function updateMode() {
    modeText.innerText = `System: ${mode}`;
    hexRow.style.display = mode === 'HEX' ? 'grid' : 'none';
  }

  function cycleTheme() {
    currentTheme = (currentTheme + 1) % themes.length;
    body.setAttribute('data-theme', themes[currentTheme]);
    saveState();
  }

  function calculate() {
    if (internalExpr === '0') return;

    try {
      let expr = internalExpr.replace(/([+\-*/×])$/, '').replace(/×/g, '*');
      let result;

      if (mode === 'HEX') {
        expr = expr.replace(/([0-9A-F]+)/gi, m => `0x${m}`);
        result = eval(expr.replace(/0x([0-9A-F]+)/gi, 'BigInt("0x$1")'));
        internalExpr = result.toString(16).toUpperCase();
      } else {
        result = eval(expr.replace(/\d+/g, n => `BigInt("${n}")`));
        internalExpr = result.toString();
      }

      lastResult = internalExpr;
      history.push(`= ${lastResult}`);
    } catch (e) {
      internalExpr = 'ERROR';
      setTimeout(() => { if (internalExpr === 'ERROR') clearDisplay(); }, 2000);
    }

    if (internalExpr.length > MAX_DIGITS) internalExpr = internalExpr.slice(0, MAX_DIGITS) + '...';
    updateDisplay();
    saveState();
  }

  function exportToHTML() {
    const timestamp = new Date().toLocaleString();
    const historyHTML = history.map(line => `<div style="margin:8px 0;padding:12px;background:#111;color:#0f0;border-radius:8px;font-family:monospace;">${line}</div>`).join('');
    const finalResult = lastResult || internalExpr;

    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Calc Result - ${timestamp}</title><style>body{font-family:sans-serif;background:#111;color:#0f0;padding:30px;text-align:center;}h1{color:#0f0;}.result{font-size:2em;background:#000;padding:20px;border-radius:12px;margin:30px auto;max-width:800px;word-break:break-all;}</style></head><body><h1>System Calculator Result</h1><p>${timestamp}</p><div>${historyHTML || '<em>No operations</em>'}</div><div class="result">${finalResult}</div></body></html>`;

    const blob = new Blob([html], {type: 'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `calculator_result_${Date.now()}.html`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // Init
  loadState();
  window.addEventListener('beforeunload', saveState);
</script>

</body>
</html>
