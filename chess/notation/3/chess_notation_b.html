<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Chess Notation (Black's view) - Optimized</title>
<style>
  :root{
    --bg:#0f1420; --tile-on:#3ec7c2; --tile-off:#2a3550;
    --ink:#e8eef8; --muted:#9fb3c8; --digit-ink:#e7f0ff; --gap:8px;
  }
  html,body{ height:100%; overflow:hidden; } /* Görgetés gátlása a jobb élményért */
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family: Inter, system-ui, -apple-system, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  h1{ font-size: 16px; margin: 5px 0; font-weight: 600; }
  
  #frame {
    display: flex; flex-direction: column; align-items: center;
    width: 95vw; max-width: 600px; gap: 8px;
  }

  /* HUD elrendezés javítása: két oszlop egy sorban */
  .hud {
    width: 100%; display: grid; grid-template-columns: 1fr 1fr;
    gap: 15px; font-size: 14px; padding: 5px 10px;
    background: rgba(255,255,255,0.05); border-radius: 8px;
  }
  .row { display: flex; align-items: center; gap: 6px; overflow: hidden; }
  .value { 
    flex: 1; overflow-x: auto; white-space: nowrap; 
    border-bottom: 1px dashed rgba(231,240,255,0.2); 
    font-weight: 700; color: var(--tile-on);
  }
  
  canvas { 
    display: block; background: #161b2a; 
    box-shadow: 0 4px 20px rgba(0,0,0,0.4); border-radius: 4px;
  }

  /* Gombok rácsos elrendezése */
  .bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(40px, 1fr));
    width: 100%; gap: 6px; margin-top: 5px;
  }
  
  button {
    border: none; border-radius: 4px;
    background: var(--tile-off); color: var(--digit-ink);
    font-weight: 700; font-size: 12px;
    aspect-ratio: 1 / 1; /* Négyzet alakú gombok */
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s, background 0.2s;
  }
  button:active { transform: scale(0.95); }
  .btn-on { background: var(--tile-on)!important; color:#0a1320!important; }

  @media (min-width: 600px) {
    h1 { font-size: 20px; }
    .hud { font-size: 18px; }
    .bar { grid-template-columns: repeat(9, 1fr); } /* Desktopon szélesebb elrendezés */
  }
</style>
</head>
<body>
<h1>Chess Notation (Black's view)</h1>
<div id="frame">
  <div class="hud" id="hud">
    <div class="row">
      <span class="label">Step:</span>
      <div id="sValue" class="value"><span class="real">0</span></div>
    </div>
    <div class="row">
      <span class="label">Score:</span>
      <div id="mValue" class="value"><span class="real">0</span></div>
    </div>
  </div>
  
  <canvas id="stage"></canvas>
  
  <div class="bar" id="buttonContainer">
    </div>
</div>

<script>
(() => {
  // --- KONFIGURÁCIÓ ÉS ÁLLAPOT ---
  const COLS = 8, ROWS = 8;
  const TOTAL = COLS * ROWS;
  const DPR = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const grid = { cols: COLS, rows: ROWS, size: 0, pad: 8, radius: 4 };
  
  const BOARD_COUNT = 65536;
  let boardsState = []; 
  let activeButtons = Array(16).fill(false);
  let viewIndex = 0;
  let isAutoToggleActive = false;
  let autoToggleInterval = null;
  let currentPerm = Array.from({length: TOTAL}, (_, i) => i);
  let permIndex = 0;
  let fillPhase = true;

  const STORAGE_KEY = `v57_factseq_${COLS}x${ROWS}_combo16_chess_black`;

  // --- ELEMEK GENERÁLÁSA ---
  const btnContainer = document.getElementById('buttonContainer');
  const btns = [];
  for (let i = 0; i < 16; i++) {
    const btn = document.createElement('button');
    btn.textContent = 'N' + i;
    btn.id = 'n' + i;
    btnContainer.appendChild(btn);
    btns.push(btn);
  }
  const autoBtn = document.createElement('button');
  autoBtn.textContent = 'S';
  autoBtn.id = 'autoToggle';
  btnContainer.appendChild(autoBtn);
  btns.push(autoBtn);

  // --- MATEMATIKAI SEGÉDFÜGGVÉNYEK (BigInt szimuláció) ---
  const stripZeros = s => (s || '0').replace(/^(-?)0+(?=\d)/, '$1') || '0';
  const addAbs = (a, b) => {
    let res = '', carry = 0, i = a.length - 1, j = b.length - 1;
    while (i >= 0 || j >= 0 || carry) {
      const da = i >= 0 ? a.charCodeAt(i) - 48 : 0;
      const db = j >= 0 ? b.charCodeAt(j) - 48 : 0;
      const s = da + db + carry;
      res = (s % 10) + res; carry = (s / 10) | 0; i--; j--;
    }
    return stripZeros(res);
  };
  const subAbs = (a, b) => {
    let res = '', borrow = 0, i = a.length - 1, j = b.length - 1;
    while (i >= 0) {
      let da = a.charCodeAt(i) - 48 - borrow;
      const db = j >= 0 ? b.charCodeAt(j) - 48 : 0;
      if (da < db) { da += 10; borrow = 1; } else borrow = 0;
      res = (da - db) + res; i--; j--;
    }
    return stripZeros(res);
  };
  const addSigned = (A, B) => {
    let sa = A[0] === '-' ? -1 : 1, a = stripZeros(A.replace(/^-/, ''));
    let sb = B[0] === '-' ? -1 : 1, b = stripZeros(B.replace(/^-/, ''));
    if (a === '0') return (sb < 0 ? '-' : '') + b;
    if (b === '0') return (sa < 0 ? '-' : '') + a;
    if (sa === sb) return (sa < 0 ? '-' : '') + addAbs(a, b);
    let cmp = a.length > b.length ? 1 : a.length < b.length ? -1 : a > b ? 1 : a < b ? -1 : 0;
    if (cmp === 0) return '0';
    if (cmp > 0) return (sa < 0 ? '-' : '') + subAbs(a, b);
    return (sb < 0 ? '-' : '') + subAbs(b, a);
  };
  const incUnsigned = A => addAbs(stripZeros(A), '1');
  const halfUnsigned = A => {
    let res = '', carry = 0;
    for (let i = 0; i < A.length; i++) {
      const n = carry * 10 + (A.charCodeAt(i) - 48);
      res += (n / 2 | 0); carry = n % 2;
    }
    return stripZeros(res);
  };

  // --- LOGIKA ---
  const emptyMatrix = () => Array.from({length: ROWS}, () => Array(COLS).fill(false));
  const defaultBoardState = () => ({ matrix: emptyMatrix(), step: "0", score: "0" });

  function draw() {
    const b = boardsState[viewIndex] || defaultBoardState();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const tileOn = getComputedStyle(document.documentElement).getPropertyValue('--tile-on');
    const tileOff = getComputedStyle(document.documentElement).getPropertyValue('--tile-off');
    const ink = getComputedStyle(document.documentElement).getPropertyValue('--digit-ink');

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = c * (grid.size + grid.pad) + grid.pad;
        const y = r * (grid.size + grid.pad) + grid.pad;
        
        ctx.fillStyle = b.matrix[r][c] ? tileOn : tileOff;
        ctx.beginPath();
        ctx.roundRect(x, y, grid.size, grid.size, grid.radius);
        ctx.fill();

        // Sakk felirat (h8...a1 sötét nézőpont)
        const file = String.fromCharCode(97 + (COLS - 1 - c));
        const rank = r + 1;
        ctx.fillStyle = b.matrix[r][c] ? "#0a1320" : ink;
        ctx.font = `bold ${Math.floor(grid.size * 0.35)}px Inter`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(file + rank, x + grid.size/2, y + grid.size/2);
      }
    }
  }

  function syncHUD() {
    const b = boardsState[viewIndex];
    document.getElementById('sValue').textContent = b.step;
    document.getElementById('mValue').textContent = b.score;
    saveState();
  }

  function fitCanvas() {
    const frame = document.getElementById('frame');
    const availableW = window.innerWidth * 0.95;
    const availableH = window.innerHeight - document.querySelector('h1').offsetHeight - document.getElementById('hud').offsetHeight - btnContainer.offsetHeight - 60;
    
    const sizeW = Math.floor((availableW - (grid.pad * (COLS + 1))) / COLS);
    const sizeH = Math.floor((availableH - (grid.pad * (ROWS + 1))) / ROWS);
    
    grid.size = Math.max(30, Math.min(sizeW, sizeH, 60));
    
    const totalW = COLS * (grid.size + grid.pad) + grid.pad;
    const totalH = ROWS * (grid.size + grid.pad) + grid.pad;
    
    canvas.width = totalW * DPR;
    canvas.height = totalH * DPR;
    canvas.style.width = totalW + 'px';
    canvas.style.height = totalH + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    draw();
  }

  function pressButton(idx) {
    if (idx === 16) {
      isAutoToggleActive = !isAutoToggleActive;
      if (isAutoToggleActive) autoToggleInterval = setInterval(processStep, 150);
      else clearInterval(autoToggleInterval);
    } else {
      activeButtons[idx] = !activeButtons[idx];
      viewIndex = activeButtons.reduce((acc, curr, i) => acc + (curr ? Math.pow(2, i) : 0), 0);
    }
    renderButtons();
    syncHUD();
    draw();
  }

  function processStep() {
    const b = boardsState[viewIndex];
    const cellIdx = currentPerm[permIndex];
    const r = Math.floor(cellIdx / COLS);
    const c = cellIdx % COLS;

    const wasOn = b.matrix[r][c];
    if (fillPhase && !wasOn) {
      b.matrix[r][c] = true;
      b.score = addSigned(b.score, "-1");
      b.step = incUnsigned(b.step);
    } else if (!fillPhase && wasOn) {
      b.matrix[r][c] = false;
      b.score = addSigned(b.score, "2");
      b.step = incUnsigned(b.step);
    }

    permIndex++;
    if (permIndex >= TOTAL) {
      permIndex = 0;
      fillPhase = !fillPhase;
    }
    syncHUD();
    draw();
  }

  function renderButtons() {
    btns.forEach((btn, i) => {
      const isOn = (i === 16) ? isAutoToggleActive : activeButtons[i];
      btn.className = isOn ? 'btn-on' : '';
    });
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ viewIndex, activeButtons, boardsState: boardsState.slice(0, 100) })); // Csak az elejét mentjük a tárhely korlát miatt
  }

  function loadState() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      activeButtons = data.activeButtons || activeButtons;
      viewIndex = data.viewIndex || 0;
    }
    boardsState = Array.from({length: BOARD_COUNT}, defaultBoardState);
  }

  // Event Listeners
  btns.forEach((btn, i) => btn.onclick = () => pressButton(i));
  window.onresize = fitCanvas;
  
  canvas.onclick = (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const c = Math.floor((x - grid.pad) / (grid.size + grid.pad));
    const r = Math.floor((y - grid.pad) / (grid.size + grid.pad));
    
    if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
      const b = boardsState[viewIndex];
      b.matrix[r][c] = !b.matrix[r][c];
      b.step = incUnsigned(b.step);
      b.score = addSigned(b.score, b.matrix[r][c] ? "-1" : "2");
      syncHUD();
      draw();
    }
  };

  loadState();
  fitCanvas();
  renderButtons();
  syncHUD();
})();
</script>
</body>
</html>
